version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cyber-twin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cyber_twin}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-cyber_twin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cyber-twin-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cyber-twin-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cyber_twin}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cyber-digital-twin-enterprise-secret-key-prod-2026}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 480
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - cyber-twin-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cyber-twin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cyber-twin-net

volumes:
  postgres_data:
    driver: local

networks:
  cyber-twin-net:
    driver: bridge
